[project]
name = "petshopfood"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NelcifranMagalhaes", email = "nelcifranpires@gmail.com" }
]
requires-python = ">=3.14.8"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
]

[project.scripts]
petshopfood = "petshopfood:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
